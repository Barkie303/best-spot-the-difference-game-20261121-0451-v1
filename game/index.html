<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Difference — Three Little Worlds</title>
<style>
  :root {
    --ink: #2b2118;
    --paper: #fdf6e9;
    --accent: #e07840;
    --green: #3d9b57;
    --red: #d64545;
    --gold: #f2b705;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #f3e8d3;
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }
  header {
    width: 100%;
    max-width: 1240px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px 4px;
  }
  header h1 { font-size: 26px; letter-spacing: 0.5px; }
  header h1 span { color: var(--accent); }
  #timerWrap { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; }
  #timerBarOuter {
    width: 220px; height: 14px; border: 2px solid var(--ink);
    border-radius: 8px; background: #fff; overflow: hidden;
  }
  #timerBar { height: 100%; width: 100%; background: var(--green); transition: width 0.2s linear; }
  #timerBar.low { background: var(--red); }
  #hud {
    width: 100%;
    max-width: 1240px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 20px 8px;
    font-size: 18px;
  }
  #hud .pill {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 4px 14px;
    font-weight: bold;
  }
  #hud #message { font-weight: bold; color: var(--accent); min-height: 1.2em; }
  main {
    width: 100%;
    max-width: 1240px;
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 0 20px;
  }
  .panel { position: relative; }
  .panel canvas {
    display: block;
    width: 580px; height: 436px;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 12px;
    cursor: crosshair;
  }
  .panel .tag {
    position: absolute; top: -12px; left: 14px;
    background: var(--ink); color: #fff;
    font-size: 13px; font-weight: bold;
    padding: 3px 10px; border-radius: 999px;
  }
  footer {
    width: 100%;
    max-width: 1240px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px 14px;
  }
  footer .keys { font-size: 14px; color: #6b5844; }
  button {
    font-family: inherit;
    font-size: 17px; font-weight: bold;
    background: var(--gold);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 8px 18px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--ink);
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  button:disabled { opacity: 0.45; cursor: default; }
  #overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(43, 33, 24, 0.55);
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #overlay .card {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 28px 36px;
    text-align: center;
    max-width: 520px;
    box-shadow: 0 10px 0 rgba(0, 0, 0, 0.25);
  }
  #overlay h2 { font-size: 30px; margin-bottom: 10px; }
  #overlay p { font-size: 17px; margin-bottom: 8px; line-height: 1.45; }
  #overlay button { margin-top: 12px; font-size: 19px; }
</style>
</head>
<body>
  <header>
    <h1>Spot the Difference <span>· Three Little Worlds</span></h1>
    <div id="timerWrap"><span id="timerText">2:00</span><div id="timerBarOuter"><div id="timerBar"></div></div></div>
  </header>
  <div id="hud">
    <span class="pill" id="roundPill">Round 1 · Cat Café</span>
    <span id="message">Find the differences — click them on either picture!</span>
    <span class="pill" id="foundPill">Found 0 / 8</span>
    <span class="pill" id="scorePill">Score 0</span>
  </div>
  <main>
    <div class="panel"><span class="tag">LEFT · ORIGINAL</span><canvas id="leftCanvas" width="580" height="436"></canvas></div>
    <div class="panel"><span class="tag">RIGHT · SPOT THE CHANGES</span><canvas id="rightCanvas" width="580" height="436"></canvas></div>
  </main>
  <footer>
    <span class="keys">Click a difference on either picture · <b>H</b> hint · <b>R</b> restart round · <b>N</b> next round</span>
    <span>
      <button id="hintBtn" type="button">💡 Hint (3)</button>
      <button id="restartBtn" type="button">↺ Restart</button>
    </span>
  </footer>
  <div id="overlay"><div class="card" id="overlayCard"></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
